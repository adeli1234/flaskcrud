services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ${MYSQL_DB:-flaskcrud}
      MYSQL_USER: ${MYSQL_USER:-flaskuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flaskpass}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"

  pythonapp:
    build: .
    ports:
      - "5001:8080"
    env_file: .env
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_USER: ${MYSQL_USER:-flaskuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flaskpass}
      MYSQL_DB: ${MYSQL_DB:-flaskcrud}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

volumes:
  mysql_data: